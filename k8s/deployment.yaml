apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuln-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vuln-app
  template:
    metadata:
      labels:
        app: vuln-app
    spec:
      containers:
        - name: vuln-app
          image: ci-sec:5000/vuln-app:IMAGE_TAG
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: vuln-app
spec:
  type: NodePort
  selector:
    app: vuln-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080

